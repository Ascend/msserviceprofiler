# SGLang metric configuration.

# ===== Frontend / request IO =====
- symbol: sglang.srt.managers.io_struct:GenerateReqInput.normalize_batch_and_arguments
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:normalize:duration
      type: timer

- symbol: sglang.srt.managers.tokenizer_manager:TokenizerManager._tokenize_one_request
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:tokenize_one:duration
      type: timer

- symbol: sglang.srt.managers.tokenizer_manager:TokenizerManager._batch_tokenize_and_process
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:batch_tokenize:duration
      type: timer

- symbol: sglang.srt.managers.tokenizer_manager:TokenizerManager._send_one_request
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:send_one:duration
      type: timer

- symbol: sglang.srt.managers.tokenizer_manager:TokenizerManager._send_batch_request
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:send_batch:duration
      type: timer

- symbol: sglang.srt.managers.tokenizer_manager:TokenizerManager._wait_one_response
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
    - name: request:wait_response:duration
      type: timer

- symbol: sglang.srt.managers.detokenizer_manager:DetokenizerManager.handle_batch_token_id_out
  handler: ms_service_metric.adapters.sglang.handlers.metric_handlers:request_io_handler
  metrics:
